- '## Plan: Senzing Demo on the Truthset


  **Dataset** (from `get_sample_data`, not memory): Senzing''s official demo **truthset** — real historical
  data, evaluation-only, 3 sources, 159 records total:


  | Source | Records | Types |

  |---|---|---|

  | CUSTOMERS | 120 | 114 PERSON, 6 ORGANIZATION |

  | REFERENCE | 22 | 16 PERSON, 6 ORGANIZATION |

  | WATCHLIST | 17 | 17 PERSON |


  Everything loads into a **fresh, throwaway scratch repository** — never your production PostgreSQL repo
  (the one in `SENZING_ENGINE_CONFIGURATION_JSON`). That repo is not touched at any point in this plan.


  ### Steps and exact commands


  **1. Fetch the full files** (the tool preview is a shape sample only, not the delivery mechanism):

  ```

  curl -fsSL https://raw.githubusercontent.com/Senzing/truth-sets/main/truthsets/demo/customers.jsonl
  -o <workspace>/customers.jsonl

  curl -fsSL https://raw.githubusercontent.com/Senzing/truth-sets/main/truthsets/demo/reference.jsonl
  -o <workspace>/reference.jsonl

  curl -fsSL https://raw.githubusercontent.com/Senzing/truth-sets/main/truthsets/demo/watchlist.jsonl
  -o <workspace>/watchlist.jsonl

  ```


  **2. Validate (not map — these are already Senzing JSON)**

  `analyze_record(file_paths=[customers.jsonl, reference.jsonl, watchlist.jsonl], workspace_dir=<workspace>)`
  → run the returned no-dependency Python analyzer against each file → checks Entity Spec compliance,
  feature coverage, confirms the 3 `DATA_SOURCE` codes to register.


  **3. Bootstrap a scratch engine + load**

  - `generate_scaffold(workflow=''initialize'')` → one-time schema/config bootstrap for a throwaway SQLite-backed
  scratch repo (registers `CUSTOMERS`, `REFERENCE`, `WATCHLIST` as data sources).

  - `generate_scaffold(workflow=''add_records'')` → threaded loader; runs `add_record` once per record
  (159 total), reporting per-file checkpoints (loaded, errors, throughput).


  **4. Drain the redo queue**

  Pattern from `sdk_guide(topic=''redo'')`: loop `process_redo_record` until the queue reports 0 pending,
  recording how many it processed.


  **5. Resolve, report, visualize**

  `reporting_guide(topic=''entity_views'' | ''reports'' | ''dashboard'')` → pull real before/after counts
  (159 records → N entities, compression ratio), a few non-obvious cross-source merges with `why` explanations,
  and render a self-contained HTML dashboard Artifact.


  **6. Final message includes**

  `Engine work: <N> add_record calls, <M> process_redo_record calls, engine <VERSION> build <BUILD>.`
  — plus explicit confirmation the data landed in the scratch repo, not your production PostgreSQL instance.


  ---


  One caveat on process: your message said doctor is already green and this shell isn''t the Senzing host,
  so I built this plan from the MCP tools without re-probing this shell — that''s why I could skip straight
  to a plan. But the moment I actually run step 1+ commands, they''ll execute wherever this session''s
  Bash tool lands, and doctor''s verdict on *that* host (not your description of your setup) is what gates
  the load. If this sandboxed shell turns out to be the execution target rather than your production host,
  doctor will catch that before any load happens.


  Want me to proceed with steps 1–5?'
