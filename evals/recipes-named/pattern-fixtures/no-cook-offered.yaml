# Fixtures for `graders/no-cook-offered.md`.
#
# `check.sh` section 8e reads the pattern OUT OF the grader file and runs it against these lists, so the grader's
# claim -- "catches an offer of the cook, leaves the required description of what the recipe needs alone" -- is
# executable rather than prose. It earns its place: the first revision both MISSED the server's own wording and
# FLAGGED a factual sentence, and nothing noticed until a review did.
#
# must_match:     text that OFFERS the cook: the server's own wording ("continue with just 500 of their records"), the
#                 verbatim lines of the failing run in eval 37016809063, a later run's "cook with just a 500-record
#                 sample" / "go with the 500-record sample", and a few paraphrases.
# must_not_match: text the skill REQUIRES or allows: facts about the product's cap, the recipe's size, a stated cook
#                 size ("we'll continue with 1,600 records"), the Setup/Prep steps, the correct refusal.
#
# Design notes. `can`/`will` after I/we are NOT offer markers (both appear in plain cap statements) and possession
# ("your records") is not the discriminator either: VOLITION is, i.e. who proposes to do it. A bare record count after
# `cook|go|proceed|continue|load|run|work` + `with|using` is a statement of size, so that alternative requires
# `just|only` or `N-record sample`.

