name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every push stacked ANOTHER full run alongside the one already in flight: ci.yml was
# the only workflow in this repo without a concurrency group. That was survivable when
# CI was cheap, but the behavioral-eval job now spends real API budget -- roughly $6-9
# per run -- so two overlapping pushes meant paying twice to grade the same branch, and
# the superseded run's result is worthless the moment the newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks (validate + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install Claude Code CLI
        # `claude plugin validate --strict` is a local manifest check (no auth needed).
        run: npm install -g @anthropic-ai/claude-code

      - name: Install PyYAML
        # check.sh section 10 parses every eval prompt.md frontmatter, which is the only
        # gate that catches a case silently failing to load (poc-planner-how-long shipped
        # that way and was never graded). The script now guards the import, so without
        # this step the gate would DEGRADE TO A FAILURE line rather than run -- install it
        # explicitly so the check actually executes where it matters.
        run: python3 -m pip install --quiet pyyaml

      - name: Run static checks (same script as local pre-commit)
        run: bash scripts/check.sh

  install-smoke:
    name: Install smoke (marketplace add + install + details)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Add local marketplace, install plugin, assert inventory
        run: |
          set -e
          claude plugin marketplace add "$PWD"
          claude plugin install senzing@senzing
          claude plugin details senzing | tee details.txt
          # Derive the expected skill count from the tree instead of hard-coding it, and
          # assert every skill NAME is listed — a count alone cannot catch a mis-named
          # directory that quietly drops one skill and picks up another.
          n=$(find plugins/senzing/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "expecting Skills ($n)"
          grep -q "Skills ($n)" details.txt
          for d in plugins/senzing/skills/*/; do
            name=$(basename "$d")
            grep -qw -- "$name" details.txt || { echo "::error::skill '$name' not listed in plugin details"; exit 1; }
          done
          grep -q "MCP servers (1)" details.txt

  mcp-urls:
    name: MCP endpoint reachable
    runs-on: ubuntu-latest
    # The bundled hosted MCP endpoint IS the product — verify it resolves and responds.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every mcpServers URL in the repo
        run: |
          set -euo pipefail
          urls=$(grep -rho '"url"[[:space:]]*:[[:space:]]*"[^"]*"' --include='*.mcp.json' --include='.mcp.json' plugins/ \
                 | sed -E 's/.*"url"[[:space:]]*:[[:space:]]*"([^"]*)".*/\1/' | sort -u)
          [ -n "$urls" ] || { echo "No mcpServers URL found"; exit 1; }
          for u in $urls; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo 000)
            echo "$u -> HTTP $code"
            # Reachable = any HTTP response below 500. 4xx is fine (endpoint up, rejects bare GET).
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "::error::MCP endpoint unreachable or erroring: $u ($code)"; exit 1
            fi
          done
      - name: Live MCP server version matches plugin.json
        # "<500" above lets a 404 from a moved path pass. The A2A agent card on the same
        # host is a hard check: it must parse AND its version must equal the plugin's
        # (the plugin version mirrors the MCP server version; a trailing -N is a
        # plugin-only patch on the same server version and is stripped before comparing).
        run: |
          set -euo pipefail
          host=$(grep -rho '"url"[[:space:]]*:[[:space:]]*"[^"]*"' --include='*.mcp.json' --include='.mcp.json' plugins/ \
                 | sed -E 's/.*"url"[[:space:]]*:[[:space:]]*"(https?:\/\/[^\/"]+).*/\1/' | sort -u | head -1)
          [ -n "$host" ] || { echo "::error::could not derive MCP host from .mcp.json"; exit 1; }
          card="$host/.well-known/agent-card.json"
          live=$(curl -sf --max-time 20 "$card" | jq -r '.version // empty')
          [ -n "$live" ] || { echo "::error::agent card missing or did not parse: $card"; exit 1; }
          want=$(jq -r .version plugins/senzing/.claude-plugin/plugin.json | sed -E 's/-[0-9]+$//')
          echo "live server=$live  plugin.json=$want  ($card)"
          if [ "$live" != "$want" ]; then
            echo "::error::plugin.json version $want does not match live MCP server $live — sync plugin.json (mcp-version-sync.yml) or wait for the server deploy"; exit 1
          fi

  cookbook-whitelist-drift:
    name: Cookbook whitelist still matches upstream
    runs-on: ubuntu-latest
    # `recipes-catalog` and `recipes-named` graders whitelist recipe FILENAMES from
    # Senzing/recipes, an upstream repo this plugin does not control. That coupling is
    # legitimate — naming a recipe that does not exist IS fabrication, and it is the
    # plugin's own defect — but it fails as a STEP CHANGE, not a probability: the day
    # upstream adds or renames a recipe, several graders across two eval cases go red
    # simultaneously with nothing wrong in this repo, and the failure surfaces as an
    # expensive eval flake rather than as what it is.
    #
    # This job is the cheap half. It reads the live cookbook and fails loudly, by name,
    # the moment the whitelist stops matching — same shape as `eula-link` above, which
    # exists because a grader can only assert what a reply SAYS, never whether the thing
    # it names still exists upstream.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The recipe filenames the evals whitelist must still exist upstream
        run: |
          set -uo pipefail
          url="https://raw.githubusercontent.com/Senzing/recipes/main/cookbook.md"
          body=$(curl -fsSL --retry 3 --retry-delay 5 --max-time 30 "$url") || {
            echo "::warning::could not fetch $url — skipping drift check rather than failing on a network blip"
            exit 0
          }
          # The exact set the graders encode. Keep in lockstep with
          # evals/recipes-catalog/graders/no-invented-recipe.md and
          # evals/recipes-named/graders/correct-recipe-fetched.md.
          expected="clair-data-ingestion-starter customer-360-crm-online customer-360-stewardship nigel-healthcare-aws-entity-browser"
          missing=0
          for r in $expected; do
            if ! printf '%s' "$body" | grep -q "$r"; then
              echo "::error::whitelisted recipe '$r' is NO LONGER in the upstream cookbook — the eval graders that name it will fail with no plugin defect. Update the whitelist in both grader files and this job together."
              missing=$((missing + 1))
            fi
          done
          # Upstream GAINING a recipe is not a failure, but the graders should learn about
          # it deliberately rather than via a red eval, so say so.
          found=$(printf '%s' "$body" | grep -oE 'recipes/[A-Za-z0-9._-]+\.md' | sed 's|recipes/||; s|\.md$||' | sort -u)
          for r in $found; do
            case " $expected " in
              *" $r "*) ;;
              *) echo "::notice::upstream cookbook now lists '$r', which the eval whitelist does not know about. Not a failure — but add it before a run reports it and a grader calls it a fabrication." ;;
            esac
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "OK: all $(printf '%s' "$expected" | wc -w | tr -d ' ') whitelisted recipes still present upstream"

  eula-link:
    name: EULA link live (the install skill's license gate)
    runs-on: ubuntu-latest
    # The `install` skill must surface the license agreement BEFORE anything runs, and
    # `install-eula/graders/eula-surfaced.md` now asserts the URL rather than the word.
    # A grader can only check what the reply SAYS; it cannot know the page still exists.
    # That gap is not hypothetical — MCP server v1.36.1 shipped five occurrences of
    # `senzing.com/senzing-eula`, which 404s, inside sentences that read perfectly.
    # This job is the other half: the asserted URL must still resolve.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The URL the install eval asserts must still resolve
        # OFFLINE-SAFE AND CLEARLY LABELLED, on the conventions real-senzing-e2e.yml uses:
        # only 404/410 — the page is gone — is a plugin verdict. Everything else (no
        # answer, a timeout, 5xx, or the 403/429 a WAF hands a datacenter IP; senzing.com
        # sits behind one and has blocked Fly and CI egress before) is ENVIRONMENTAL and
        # says so, because a network blip must never read as "the plugin points at a dead
        # link". A runner with no egress at all gets `000` and lands in that branch too.
        run: |
          set -uo pipefail
          grader=plugins/senzing/evals/install-eula/graders/eula-surfaced.md
          if [ ! -f "$grader" ]; then
            echo "::error::$grader is gone — the EULA assertion moved. Point this job at its new home; do not delete the check."
            exit 1
          fi
          # Single source of truth: the URL is read out of the grader's own regex, so the
          # liveness check cannot drift from the string the eval demands.
          pattern=$(sed -n "s/^pattern:[[:space:]]*'\(.*\)'[[:space:]]*$/\1/p" "$grader" | head -1)
          if [ -z "$pattern" ]; then
            echo "::error::no quoted \`pattern:\` line in $grader — cannot derive the URL the eval asserts"
            exit 1
          fi
          # The grader's pattern is a regex; drop its backslash escapes to get the literal.
          url="https://${pattern//\\/}"
          echo "asserted by the eval: $url"
          # --retry writes %{http_code} once PER ATTEMPT, so a retried request prints
          # "000000"/"500500". Keep the last three characters — the final attempt's code.
          raw=$(curl -sIL --retry 2 --retry-delay 5 --max-time 30 \
                     -o /dev/null -w '%{http_code}' "$url" || true)
          code=$(printf '%s' "$raw" | tail -c 3)
          [ -n "$code" ] || code=000
          echo "$url -> HTTP $code"
          case "$code" in
            2*|3*)
              echo "EULA link is live." ;;
            404|410)
              echo "::error::DEAD EULA LINK — $url returns HTTP $code. This is the v1.36.1 defect class: the install skill sends users to a page that does not exist. Fix the URL in the skill/MCP source AND in $grader, which asserts it."
              exit 1 ;;
            *)
              echo "::notice::ENVIRONMENTAL (not a plugin verdict) — $url answered HTTP $code, which is a reachability problem on this runner, not a dead link. senzing.com sits behind a WAF that has blocked datacenter egress before, and a runner with no egress reports 000. Only 404/410 fails this job. Do NOT change a skill, a grader or a URL in response to this line."
              ;;
          esac

  behavioral-eval:
    name: Behavioral eval (claude plugin eval)
    # macOS, deliberately — the ONLY job in this workflow not on ubuntu.
    #
    # The eval grants Bash to the agent under test, which requires a sandbox. On
    # ubuntu-24.04 that sandbox is bubblewrap, and it failed three separate ways here,
    # each invisible until the one above it was cleared:
    #   1. AppArmor denies the unprivileged user namespace -> loopback RTM_NEWADDR
    #   2. the runner image has no /run/shm                -> Can't mount tmpfs
    #   3. the CLI's own sandbox home construction         -> "Can't create file at
    #      /tmp/claude-eval-XXXX/home/.aws: Is a directory"
    # Faults 1 and 2 were fixable here. Fault 3 is inside the CLI's sandbox setup and
    # is not reachable from this repo; removing the runner's ~/.aws does not clear it.
    # With Bash dead, every shell-dependent case (doctor, install, analyze, demo) was
    # graded on a machine it could not touch and reported as a plugin failure.
    #
    # macOS has its sandbox built in — no bubblewrap, none of the three faults. The
    # same suite passes these cases there (verified locally: analyze, doctor and
    # install all 0.81-1.00 on macOS while scoring 0.50-0.75 on the ubuntu runner with
    # identical code and pinned models). Public repo, so macOS minutes are not billed.
    runs-on: macos-latest
    timeout-minutes: 90
    # Gates the PR on plugin BEHAVIOR (skill routing, MCP grounding, no-simulation, scratch-repo
    # default) whenever an API key is available. It degrades to a SKIP — never a silent pass —
    # only when the secret is genuinely absent (fork PRs: GitHub withholds secrets). Every other
    # problem fails the job: zero cases discovered, the early-access gate, a threshold miss.
    #
    # History: this job used to be `if: workflow_dispatch` + `continue-on-error: true`, and it ran
    # `claude plugin eval ./plugins/senzing` while the cases lived at the repo root — the CLI only
    # discovers `<plugin>/evals/`, so ZERO cases ever ran and nothing could fail. The suite now
    # lives under plugins/senzing/evals/ and run.sh asserts the discovered count.
    env:
      # Read into env (not a step `if:`) — `secrets.*` in a step `if:` is rejected by GHA at
      # parse time, and an empty secret must produce a visible skip, not a parse failure.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Pinned, not left to the default. Sonnet is the model these skills are
      # required to work well on (strong models are the ceiling, Haiku is input
      # only), so it is the model the gate must grade. run.sh already defaults
      # to sonnet, but a default is not a guarantee: --model previously resolved
      # to whatever the environment produced, which made a local pass and a CI
      # pass two different measurements of two different models.
      EVAL_MODEL: sonnet
      EVAL_JUDGE_MODEL: sonnet
      # Pinned deliberately — see the install step. Keep in step with local dev.
      # 2.1.269 is chosen between two CLI bugs, both measured on this suite.
      #   At or below 2.1.268: the CLI writes its own sandbox config with //tmp and
      #   //private/tmp in denyWrite — the PARENT of the //private/tmp/e-XXXX allowWrite
      #   roots it scaffolds each eval under. The macOS seatbelt writer emits
      #   allow-then-deny with no carve-out and SBPL is last-match-wins, so EVERY Bash
      #   write was denied. 2.1.269 is the earliest release that drops the parent entry
      #   and substitutes narrow per-uid paths (bisected 2.1.260..2.1.277).
      #   At 2.1.278: the session no longer waits for the plugin MCP server. The FIRST
      #   session on a runner stays "pending" and its tools never register — one run made
      #   five ToolSearch calls, slept 20s and gave up with zero mcp__ calls, and every
      #   Senzing assertion in it would have read as a skill defect. All 66 traces of the
      #   last 2.1.259 run were "connected", so this is new behavior, not ours.
      # 2.1.269 was verified to have both: ask-routing as a FIRST session in a fresh HOME
      # reported mcp_servers connected with 13 tools and passed 7/7, and sandbox-canary
      # wrote and read back its file with zero "Operation not permitted".
      # gate.py fails any run whose session started without the MCP, so if a future bump
      # reintroduces that, it surfaces as a structural failure and never as a skill score.
      CLAUDE_CLI_VERSION: "2.1.269"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gate on API key availability
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not available to this run (fork PR or secret unset) — behavioral eval SKIPPED, not passed."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.gate.outputs.has_key == 'true'
        # The CLI is PINNED. It used to be unpinned, which silently introduced a second
        # variable: CI resolved 2.1.277 while local dev ran 2.1.259. That is not
        # cosmetic -- run.sh probes `--help` and only appends --trust-plugin and
        # --concurrency when the CLI advertises them, so the two environments ran
        # DIFFERENT FLAGS as well as different code, and "it passes locally but fails in
        # CI" was unfalsifiable. Bump this deliberately, with a re-run, never implicitly
        # on whatever npm serves today.
        #
        # No sandbox backend to install: macOS provides it. That is the point of running
        # this job here rather than on ubuntu (see the runs-on comment above).
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"
          claude --version

      - name: Canary — two cheap cases must reach the MCP and write from Bash
        if: steps.gate.outputs.has_key == 'true'
        # THE GATE THAT WOULD HAVE SAVED A DAY, third attempt.
        #
        # A full run ($6, ~7 min) once reported 4/14 and was read as a plugin-quality
        # problem. It was not: the agent had NO Senzing MCP tools in session at all.
        # The server CONNECTED (all 31 of its prompts registered as slash commands)
        # while its TOOLS never arrived, so every `tool_used` grader failed for purely
        # environmental reasons.
        #
        # My first attempt at this gate used a synthetic `claude -p --mcp-config`
        # probe and asserted on the init event's tools[]. That was WRONG and would
        # have blocked every run: the identical probe reports 0 mcp__ tools on a
        # developer Mac where the eval itself registers all 13. A standalone `claude -p`
        # does not load the MCP the way `plugin eval` does (plugin-sourced server,
        # different registration timing), so it cannot answer this question.
        #
        # The second attempt ran the right case and then read the wrong disk. It globbed
        # $TMPDIR/**/trace.jsonl, but on macOS TMPDIR is /var/folders/... while the eval
        # scaffolds under /private/tmp/e-*, so it matched ZERO traces on every run, printed
        # "canary produced no trace" as a ::warning:: and exited 0 (see run 35667715196).
        # Neither the MCP assertion nor the sandbox scan has ever inspected a trace. Both
        # now read tracePath out of the eval's own JSON (cases[].arms.<arm>[].tracePath),
        # the glob is a fallback only, and no traces is a FAILURE: a canary that graded
        # nothing is not a pass.
        #
        # Two cases, both cheap (~$0.36 to protect a ~$6 run):
        #   ask-routing    — a real mcp__ tool_use must appear in the trace (reachability).
        #   sandbox-canary — a Bash write must succeed. ask-routing deliberately runs NO
        #                    shell, so it can never see a shell fault; this case probes the
        #                    write directly, and assembles its token at runtime so the
        #                    asserted pattern cannot leak out of the echoed command.
        run: |
          set -o pipefail
          EVAL_RUNS=1 EVAL_JSON=/tmp/canary-ask.json \
            bash plugins/senzing/evals/run.sh --case ask-routing --keep-temp || true
          EVAL_RUNS=1 EVAL_JSON=/tmp/canary-sandbox.json \
            bash plugins/senzing/evals/run.sh --case sandbox-canary --keep-temp || true
          python3 - <<'CANARY'
          import glob, json, os, sys

          # The eval records where it wrote each run's trace. Read THAT. The scaffold root
          # is the CLI's business, not ours, and the previous guess at it matched nothing.
          def traces_from(result_json):
              paths = []
              try:
                  with open(result_json, encoding='utf-8') as fh:
                      data = json.load(fh)
              except (OSError, ValueError) as exc:
                  print(f'::warning::cannot read {result_json}: {exc}')
                  data = {}
              for case in data.get('cases') or []:
                  for runs in (case.get('arms') or {}).values():
                      for run in runs or []:
                          tp = run.get('tracePath')
                          if tp and os.path.exists(tp):
                              paths.append(tp)
              if not paths:
                  # Secondary only — never the sole source. Both plausible scaffold roots.
                  for root in ('/private/tmp', '/tmp', os.environ.get('TMPDIR') or '/tmp'):
                      paths += glob.glob(os.path.join(root, 'e-*', '**', 'trace.jsonl'),
                                         recursive=True)
              return sorted(set(paths))

          def read_all(paths):
              blobs = []
              for path in paths:
                  try:
                      with open(path, encoding='utf-8', errors='replace') as fh:
                          blobs.append(fh.read())
                  except OSError as exc:
                      print(f'::warning::cannot read trace {path}: {exc}')
              return blobs

          ask_traces = traces_from('/tmp/canary-ask.json')
          box_traces = traces_from('/tmp/canary-sandbox.json')

          failed = False
          for label, paths in (('ask-routing', ask_traces), ('sandbox-canary', box_traces)):
              print(f'{label}: {len(paths)} trace(s)')
              for path in paths:
                  print(f'  {path}')
              if not paths:
                  print(f'::error::the {label} canary produced no trace, so this gate '
                        'inspected nothing. A canary that graded nothing is not a pass — '
                        'refusing to spend the eval budget on an unverified runner.')
                  failed = True
          if failed:
              sys.exit(1)

          ask_blobs = read_all(ask_traces)
          box_blobs = read_all(box_traces)

          # 1. The Senzing MCP must be reachable from the eval session.
          seen = set()
          for blob in ask_blobs:
              for chunk in blob.split('"name":"')[1:]:
                  name = chunk.split('"', 1)[0]
                  if name.startswith('mcp__'):
                      seen.add(name)
          if seen:
              print(f'MCP OK — {len(seen)} Senzing MCP tool(s) invoked:')
              for name in sorted(seen):
                  print(f'  {name}')
          else:
              print('::error::The canary case completed without invoking a single mcp__* tool. '
                    'The Senzing MCP is not reachable from the eval session on this runner, so '
                    'the full suite would grade an agent that cannot call the tools under test '
                    'and every tool_used grader would fail environmentally.')
              failed = True

          # 2. Bash must be able to WRITE. The token is assembled at runtime by the case, so
          #    finding it in the trace means a write actually landed and was read back.
          if any('SANDBOXWRITE_OK' in blob for blob in box_blobs):
              print('sandbox OK — Bash wrote a file in the scaffold and read it back')
          else:
              print('::error::The sandbox-canary trace does not contain SANDBOXWRITE_OK: Bash '
                    'could not write to the eval scaffold. This is the CLI deny-parent bug — a '
                    'denyWrite entry (//tmp, //private/tmp) that is the PARENT of the run\'s own '
                    'allowWrite scaffold, which last-match-wins seatbelt resolves as denied. '
                    f'Fixed in CLI 2.1.278; this runner has {os.environ.get("CLAUDE_CLI_VERSION", "?")}. '
                    'doctor/install/analyze/demo would be graded on a host they cannot touch.')
              failed = True

          # 3. Any sandbox error in either trace, whichever backend produced it.
          sandbox_errs = set()
          for blob in ask_blobs + box_blobs:
              for marker in ('bwrap:', 'sandbox-exec:', 'Operation not permitted'):
                  at = blob.find(marker)
                  while at >= 0:
                      sandbox_errs.add(blob[at:at + 110].split('\\')[0].strip())
                      at = blob.find(marker, at + len(marker))
          if sandbox_errs:
              print('::error::The Bash sandbox is broken on this runner:')
              for err in sorted(sandbox_errs)[:5]:
                  print(f'  {err}')
              print('::error::Every Bash call in the suite would fail, so doctor/install/'
                    'analyze/demo would be graded on a machine they cannot touch. '
                    'Refusing to spend the eval budget.')
              failed = True

          sys.exit(1 if failed else 0)
          CANARY

      - name: Run eval suite (same script as local)
        if: steps.gate.outputs.has_key == 'true'
        # run.sh: asserts every case dir on disk was discovered, fails on the early-access gate
        # message, propagates the --threshold exit code.
        #
        # Budget is left at run.sh's defaults (2 runs, $75). That figure is a
        # RUNAWAY GUARD, not a spend estimate — the suite is small, and the two
        # cases measured so far came to $1.53 combined. Do not tighten it as a
        # cost-saving measure: a ceiling low enough to bind does not save money,
        # it truncates a legitimate run into a `partial` and reports a false
        # failure. Tune it only if a real runaway is ever observed.
        #
        # --keep-temp preserves each run's scaffold dir, which is where the CLI writes
        # trace.jsonl. Without it the temp dir is cleaned and a CI failure is
        # undiagnosable from the artifact: ci.json records WHICH graders failed but not
        # which tools were actually invoked. That gap cost a full debugging cycle -- CI
        # said every `tool_used` MCP grader failed while every `regex`-on-trace one
        # passed, and there was no way to tell "the MCP was never called" from "it was
        # called differently than the grader expected".
        run: bash plugins/senzing/evals/run.sh --keep-temp

      - name: build case — the generated SDK file must actually be valid Python
        if: always() && steps.gate.outputs.has_key == 'true'
        # THE `build` OUTPUT WAS NEVER PARSED. Its three file graders are
        # `file_exists` + `no-v3-names` (not_contains) + `provenance-kept` (a URL), and a
        # file containing nothing but `# https://example.com` satisfies all three. The
        # grader vocabulary cannot execute anything, so the only place this can live is a
        # workflow step — the same move `evals-real` made with verify_truthset.py.
        #
        # `build/SKILL.md` makes this the skill's OWN definition of done: "it compiles /
        # type-checks with the project's own toolchain (e.g. `python -m py_compile` …) —
        # name the command you ran". So this step runs the criterion the skill claims.
        #
        # It reads the scaffold dirs the eval leaves behind: `run.sh` passes `--keep-temp`
        # (load-bearing, see its comment), which is what lets the "Collect traces" step
        # below find trace.jsonl under /private/tmp/e-*/ on this runner. The generated file
        # sits in the same tree, at <scaffold>/home/cwd/.
        run: |
          set -uo pipefail
          grader=plugins/senzing/evals/build/graders/file-written.md
          if [ ! -f "$grader" ]; then
            echo "::error::$grader is gone — the build case's file assertion moved. Point this step at its new home; do not delete the check."
            exit 1
          fi
          # Not hard-coded: the filename comes from the grader that asserts it, so the two
          # cannot drift apart.
          name=$(sed -n "s/^path:[[:space:]]*[\"']\{0,1\}\([^\"' ]*\)[\"']\{0,1\}[[:space:]]*$/\1/p" "$grader" | head -1)
          if [ -z "$name" ]; then
            echo "::error::no \`path:\` line in $grader — cannot tell which generated file to compile"
            exit 1
          fi
          echo "compiling every '$name' left in the kept eval scaffolds"
          found=0
          bad=0
          while IFS= read -r f; do
            found=$((found + 1))
            python3 - "$f" <<'PYTHON' || bad=1
          import ast, sys

          path = sys.argv[1]
          src = open(path, encoding='utf-8', errors='replace').read()
          try:
              tree = ast.parse(src, filename=path)
          except SyntaxError as exc:
              print(f'::error::{path} is NOT valid Python: {exc}. This is a plugin verdict: '
                    'build wrote SDK code that does not parse, and file_exists + no-v3-names + '
                    'provenance-kept all pass on it. `python -m py_compile` is the build '
                    "skill's own stated DONE criterion.")
              sys.exit(1)
          kinds = (ast.Import, ast.ImportFrom, ast.FunctionDef,
                   ast.AsyncFunctionDef, ast.ClassDef)
          if not any(isinstance(node, kinds) for node in ast.walk(tree)):
              print(f'::error::{path} parses but has no import, function or class in it. A file '
                    'of comments compiles cleanly, carries a URL (so provenance-kept passes) and '
                    'mentions no V3 name (so no-v3-names passes) — and is not generated SDK code. '
                    'That is the exact hole this step exists to close.')
              sys.exit(1)
          print(f'ok  {path} — valid Python, contains real SDK code')
          PYTHON
          done < <(find -L "${TMPDIR:-/tmp}" /tmp /private/tmp -maxdepth 8 -name "$name" 2>/dev/null | sort -u)
          echo "compiled $found file(s) named $name"
          if [ "$found" -eq 0 ]; then
            echo "::notice::ENVIRONMENTAL (not a plugin verdict) — no '$name' was found under the kept scaffold dirs, so this step compiled nothing and asserts nothing. Whether the build case wrote the file at all is the file-written grader's job and it runs inside the eval. Fix the scaffold retention (--keep-temp) or the search path here; do NOT change a skill, a case or a grader in response to this line."
            exit 0
          fi
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

      - name: Collect traces for diagnosis
        if: always() && steps.gate.outputs.has_key == 'true'
        # Best-effort: the temp dirs are outside the workspace. Copy just the trace
        # files (small, JSONL) next to the results so they ride along in the artifact.
        #
        # Search BOTH $TMPDIR and /tmp, and go deeper. The first version searched only
        # `${TMPDIR:-/tmp}` at maxdepth 4, which silently collected ZERO traces on the
        # macOS runner -- macOS sets TMPDIR to a per-user /var/folders/... path while
        # the CLI's scaffold dirs live under /tmp, and the nesting is deeper than 4.
        # It reported "collected 0" and the artifact shipped without traces, so the
        # first macOS failure had to be diagnosed from grader `evidence` alone.
        #
        # The depth-8 fix STILL collected zero, for a second reason: on macOS `/tmp` is
        # a SYMLINK to /private/tmp, and `find` does not follow symlinks without -L. The
        # CLI's scaffold dirs are `/private/tmp/e-XXXXXX/out/trace.jsonl`. Hence -L plus
        # /private/tmp explicitly, and the fallback listing looks for `e-*` too, which
        # is what the dirs are actually named on macOS (not `claude-eval-*`).
        run: |
          dest=plugins/senzing/evals/results/traces
          mkdir -p "$dest"
          n=0
          while IFS= read -r t; do
            n=$((n + 1))
            cp "$t" "$dest/trace-$n.jsonl" 2>/dev/null || true
          done < <(find -L "${TMPDIR:-/tmp}" /tmp /private/tmp -maxdepth 8 -name 'trace.jsonl' 2>/dev/null | sort -u)
          echo "collected $n trace file(s) into $dest"
          if [ "$n" -eq 0 ]; then
            echo "::warning::no trace.jsonl found — a CI-only failure will not be diagnosable from this artifact"
            echo "searched: ${TMPDIR:-<unset>} and /tmp"
            find -L /tmp /private/tmp -maxdepth 1 \( -name 'claude-eval-*' -o -name 'e-*' \) 2>/dev/null | head -5 || true
          fi
          # A tool-name histogram in the log itself, so the answer is visible without
          # downloading anything.
          if [ "$n" -gt 0 ]; then
            echo "== tool_use histogram across collected traces =="
            cat "$dest"/*.jsonl 2>/dev/null \
              | grep -o '"name":"[A-Za-z0-9_]*"' \
              | sort | uniq -c | sort -rn | head -30
          fi

      - name: Upload eval results (JSON, log, HTML report)
        if: always() && steps.gate.outputs.has_key == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: behavioral-eval-results
          path: plugins/senzing/evals/results/
          if-no-files-found: warn
          retention-days: 14
