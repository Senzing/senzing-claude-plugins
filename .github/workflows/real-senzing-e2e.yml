---
name: Real Senzing E2E

# The one eval that runs the plugin all the way to a resolved dataset and checks
# the answer against published ground truth.
#
# Why it is a separate workflow and not another case in ci.yml's behavioral-eval:
#
#   * behavioral-eval runs on macos-latest DELIBERATELY (three stacked bubblewrap
#     faults on ubuntu-24.04 — see its `runs-on` comment) and its whole suite is
#     built around a sandbox with NO Senzing installed; several cases assert that
#     absence. This job needs the opposite: a Linux host with senzingsdk-runtime
#     and a writable filesystem. Nothing here touches that job.
#   * its run.sh asserts "cases discovered == case directories on disk", so the
#     new case lives in a sibling eval dir (plugins/senzing/evals-real/) that the
#     macOS suite never sees.
#
# Why it does not gate every PR: it builds a container, downloads a ~260 MB SDK
# package and runs a full map -> load -> resolve, so it is slow and it spends API
# budget. It runs on EVERY pull request, plus weekly and on demand.
#
# It was originally label-gated. That was wrong for the same reason the opt-in
# behavioral eval was wrong: this is the ONLY test anywhere that runs the plugin
# all the way to a resolved dataset and checks the entity count against ground
# truth. Everything else proves routing and grounding on a host with no Senzing.
# A gate that runs only when someone remembers a label does not protect the one
# property it exists to protect.

on:
  workflow_dispatch:
  schedule:
    # Mondays 07:00 UTC. Catches drift in the plugin, the MCP server and the
    # Senzing release, none of which are pinned to this repo's commits.
    - cron: "0 7 * * 1"
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-senzing-e2e:
    name: Real Senzing end-to-end (map -> load -> resolve -> ground truth)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Read into env, never into a step `if:` — `secrets.*` in a step `if:` is
      # rejected by GHA at parse time and the run reports as a 0s failure with no
      # jobs scheduled.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SENZING_EVAL_IMAGE: senzing-claude-plugins-eval:local
      # Host directory mounted at /tmp inside the container, so the eval's
      # --keep-temp workspaces survive between steps and the verifier can open
      # the Senzing repository the run left behind.
      SENZING_EVAL_TMP: ${{ github.workspace }}/../sz-eval-tmp
      # One run: each is a full map+load+resolve, and the ground-truth gate
      # inspects the single repository it produces.
      EVAL_RUNS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ground-truth self-test (free, offline, no Senzing, no API key)
        # Runs before anything is built or spent. Re-derives the expected record
        # and entity counts from the vendored truth-set key, asserts the key and
        # the fixtures still describe the same 159 records, and asserts the two
        # literals in the graders still match the derived numbers. Fixture drift
        # must fail for $0, not halfway through a paid run.
        run: python3 plugins/senzing/evals-real/verify_truthset.py --self-test

      - name: Gate on API key availability
        id: gate
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not available to this run (fork PR or secret unset) — real-Senzing eval SKIPPED, not passed."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare the shared temp mount
        if: steps.gate.outputs.has_key == 'true'
        # Mounted at /tmp in the container, so it needs /tmp's permissions.
        run: |
          mkdir -p "$SENZING_EVAL_TMP"
          chmod 1777 "$SENZING_EVAL_TMP"

      - name: Build the Senzing eval image
        id: build
        if: steps.gate.outputs.has_key == 'true'
        # Plain `docker build` — no extra action to pin, and the layers that cost
        # time (the ~260 MB senzingsdk-runtime package) are the ones a registry
        # cache would not help with on a fresh runner anyway. ~5 minutes.
        #
        # The EULA is accepted here, in the open, by the repository that owns it.
        # The Dockerfile has no default for this arg on purpose.
        run: |
          docker build \
            --build-arg SENZING_ACCEPT_EULA=I_ACCEPT_THE_SENZING_EULA \
            --tag "$SENZING_EVAL_IMAGE" \
            --file .github/senzing-eval/Dockerfile \
            .github/senzing-eval

      - name: Senzing preflight — prove the engine runs before spending anything
        id: preflight
        if: steps.gate.outputs.has_key == 'true'
        # Free (no API calls). Builds a scratch SQLite repository, loads three
        # records, drains redo and reads them back. If Senzing cannot run here the
        # job stops HERE, with "Senzing cannot run on this host" rather than a
        # score that reads like a plugin verdict. It never falls back to a
        # simulated result.
        run: bash .github/senzing-eval/in-container.sh 'python3 /work/.github/senzing-eval/preflight.py /tmp/sz-preflight'

      - name: Sandbox preflight — prove the agent's Bash tool works before spending
        id: sandbox
        if: steps.gate.outputs.has_key == 'true'
        # ~$0.016. Runs the real pinned CLI with the sandbox on and asserts that a
        # shell command ran and its output came back, reading a nonce the model
        # cannot know.
        #
        # This is the check that was missing. The Senzing preflight above proves
        # the ENGINE runs; nothing proved the agent could reach a shell. Two full
        # runs were spent and reported as plugin scores of 0.44 while every Bash
        # call was dying at `bwrap: Can't mount tmpfs on /newroot/run/shm`.
        run: bash .github/senzing-eval/in-container.sh 'bash /work/.github/senzing-eval/sandbox-preflight.sh /tmp/sz-sandbox-probe'

      - name: Run the real-Senzing eval suite
        if: steps.gate.outputs.has_key == 'true'
        # --keep-temp preserves the run workspace, which is where the agent's
        # scratch Senzing repository lives. The next step opens it.
        run: bash .github/senzing-eval/in-container.sh 'bash plugins/senzing/evals-real/run.sh --keep-temp'

      - name: Collect traces, and fail ENVIRONMENTAL if the sandbox never ran
        id: env_gate
        if: always() && steps.gate.outputs.has_key == 'true'
        # ORDER MATTERS, and it is the whole point of this step sitting HERE, ahead of the
        # ground-truth verification rather than after it. Whether the sandbox ran at all is a
        # question about the MEASUREMENT; whether the entities are right is a question about
        # the PRODUCT, and the second one is meaningless until the first is answered yes.
        # Run the wrong way round, the job emitted the verifier's
        #   FAIL — 159 of 159 ground-truth records are not in the repository
        #   (SzUnknownDataSourceError (2207) ... [CUSTOMERS] does not exist)
        # first and the environmental truth second. That verdict was read as a plugin defect
        # twice, the second time with the full log open, and nearly produced a "fix" to a
        # data-source registration bug that does not exist. The truth also being in the log is
        # not good enough when the lie is louder and comes first.
        # The copy runs INSIDE the container, for the same reason the marker hunt
        # does: the traces live under the `--keep-temp` workspace, which is
        # root-owned with its modes closed, and a host-side find walked straight
        # past it. It collected 0 traces on two consecutive runs -- which silently
        # disabled the bwrap check below, the one line in this job that would have
        # said "the sandbox is broken" instead of letting a 0.44 read as a plugin
        # verdict. in-container.sh's EXIT trap hands /work back to the runner uid
        # afterwards, so the host-side analysis below can read what it copied.
        run: |
          set -euo pipefail
          dest=plugins/senzing/evals-real/results
          bash .github/senzing-eval/in-container.sh '
            set -euo pipefail
            dest=/work/plugins/senzing/evals-real/results
            mkdir -p "$dest/traces"
            n=0
            while IFS= read -r t; do
              n=$((n + 1))
              cp "$t" "$dest/traces/trace-$n.jsonl" 2>/dev/null || true
            done < <(find -L /tmp -maxdepth 8 -name trace.jsonl 2>/dev/null | sort -u)
            echo "collected $n trace file(s) into $dest/traces"
          ' || echo "::warning::trace collection failed — the analysis below has nothing to read"
          # The COPY is best-effort -- a docker hiccup here must not invent a
          # failure. What is not best-effort is the sandbox check at the bottom.
          n=0
          if [ -d "$dest/traces" ]; then
            n=$(find "$dest/traces" -name 'trace-*.jsonl' | wc -l | tr -d ' ')
          fi
          if [ "$n" -eq 0 ]; then
            exit 0
          fi
          echo "== tool_use histogram across collected traces =="
          cat "$dest"/traces/*.jsonl 2>/dev/null \
            | grep -o '"name":"[A-Za-z0-9_]*"' \
            | sort | uniq -c | sort -rn | head -30 || echo "  none"

          # THE ENVIRONMENTAL GATE.
          #
          # A sandbox error in the traces means the agent's Bash tool never ran a
          # command, so NOTHING about the plugin was measured -- and the suite
          # still prints a score, because every grader is a statement about text.
          # That score is a lie with a number on it. It has now been read as a
          # plugin defect three separate times, once with the log open.
          #
          # So this is not a diagnostic any more. `bwrap:` or `sandbox-exec:` in a
          # trace fails the job under its own name: ENVIRONMENTAL, explicitly not
          # a verdict on the plugin, and never a reason to touch a skill, a case
          # or a grader.
          sandbox_errs="$(grep -ohE 'bwrap:[^"]{0,110}|sandbox-exec:[^"]{0,110}' \
            "$dest"/traces/*.jsonl 2>/dev/null | sort -u | head -5 || true)"
          if [ -n "$sandbox_errs" ]; then
            echo "== sandbox failures =="
            printf '%s\n' "$sandbox_errs"
            # Free forensics, no API call. `--keep-temp` leaves the harness's own
            # sandbox HOME on the bind mount, and root inside the container can
            # read it. The standing question about the `.aws` fault is who creates
            # that path and what it is, which nobody has looked at because until
            # now nothing could read the tree. Strictly diagnostic: it must never
            # change whether this step fails.
            bash .github/senzing-eval/in-container.sh '
              echo "-- image HOME:"; ls -la /root 2>&1 | head -20
              echo "-- image /root/.aws:"; ls -lad /root/.aws 2>&1
              for h in /tmp/claude-eval-*/home; do
                echo "-- harness HOME $h:"; ls -la "$h" 2>&1 | head -30
                echo "-- $h/.aws:"; ls -lad "$h/.aws" 2>&1
                ls -la "$h/.aws" 2>&1 | head -10
              done
            ' || echo "  (forensics unavailable)"
            echo "::error::ENVIRONMENTAL FAILURE (not a plugin verdict) — the agent's Bash sandbox failed, so no shell command ran and nothing about the plugin was measured. Any case score printed above is meaningless. Fix the image or the harness; do NOT change a skill, an eval case, a grader or an expected count in response to this."
            exit 1
          fi
          echo "== sandbox failures =="
          echo "  none"

      - name: Ground-truth verification (THE gate)
        # Only once the sandbox is known GOOD. If the agent never got a shell, the eval never
        # built a repository, the only Senzing database on disk is the preflight's own three
        # records, and every number this step could print would be an artefact of that. It is
        # skipped, loudly, by the step below.
        if: always() && steps.gate.outputs.has_key == 'true'
          && steps.sandbox.outcome == 'success'
          && steps.env_gate.outcome == 'success'
        # Runs even when the eval step failed: whether the engine produced the
        # right entities is the more informative signal, and "no repository at
        # all" is itself the verdict for a run that reported numbers it never
        # computed.
        #
        # This is deliberately NOT a grader. `claude plugin eval` has no
        # shell/command grader, so every grader verdict is ultimately a statement
        # about text the agent produced — and text is exactly what a fabricating
        # run is good at. This step opens the repository instead.
        #
        # The marker hunt runs INSIDE the container, with the verifier. `--keep-temp`
        # leaves the workspace root-owned with its modes closed as far as the harness
        # can manage, so a HOST-side find cannot traverse it: it reported
        # "<none found>" for two consecutive runs on a workspace where the scaffold
        # had demonstrably run (the agent read the CSVs it copied in). A diagnostic
        # that cannot read its own input is the same defect as a gate that cannot
        # fail. Root inside the container can read it.
        run: |
          set -euo pipefail
          bash .github/senzing-eval/in-container.sh '
            set -euo pipefail
            root=$(find /tmp -maxdepth 8 -name .sz-eval-root -print -quit 2>/dev/null || true)
            echo "scaffold marker: ${root:-<none found>}"
            python3 /work/plugins/senzing/evals-real/verify_truthset.py \
              --search-root /tmp \
              --out /work/plugins/senzing/evals-real/results/ground-truth-verdict.json
          '

      - name: Ground-truth verification SKIPPED — nothing was measured
        if: always() && steps.gate.outputs.has_key == 'true'
          && (steps.sandbox.outcome != 'success' || steps.env_gate.outcome != 'success')
        # This notice used to blame the Bash sandbox unconditionally, which is wrong for
        # every skip it does not cause. The sandbox step carries `if: has_key == true` and
        # nothing else, so ANY earlier failure — the image build, the Senzing engine
        # preflight — leaves it `skipped`, and a skipped sandbox is not a broken sandbox.
        # A notice that names the wrong cause is the same defect this job exists to remove:
        # a loud, confident, wrong first line. So name the step that actually went red,
        # reading the outcomes rather than assuming one.
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
          ENV_GATE_OUTCOME: ${{ steps.env_gate.outcome }}
        run: |
          set -euo pipefail
          # Common to every branch: the run produced no repository of its own, so no number
          # derived from the disk is a statement about the plugin.
          artefact="Any verdict derived from the database on disk (\"159 of 159 ground-truth records are not in the repository\", \"SzUnknownDataSourceError (2207) ... CUSTOMERS does not exist\") would be an artefact of the failure above — the only database there is the Senzing preflight's own three records. That has twice been misread as a plugin defect."
          hands_off="do NOT change a skill, an eval case, a grader or an expected count in response to this."
          echo "step outcomes: build=$BUILD_OUTCOME preflight=$PREFLIGHT_OUTCOME sandbox=$SANDBOX_OUTCOME env_gate=$ENV_GATE_OUTCOME"
          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "::notice::Ground-truth verification was deliberately SKIPPED, and the cause is NOT the agent's Bash sandbox: the eval image build ended '$BUILD_OUTCOME', so every step behind it — including the sandbox probe — was skipped. $artefact Fix the Dockerfile or the build; $hands_off"
          elif [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            echo "::notice::Ground-truth verification was deliberately SKIPPED, and the cause is NOT the agent's Bash sandbox: the Senzing engine preflight ended '$PREFLIGHT_OUTCOME' — Senzing itself could not run on this host, so the sandbox probe and the eval were skipped behind it. $artefact Fix the image or the engine configuration; $hands_off"
          elif [ "$SANDBOX_OUTCOME" = "failure" ]; then
            echo "::notice::Ground-truth verification was deliberately SKIPPED. The sandbox preflight FAILED: the agent's Bash tool could not run a command, so the eval never created a Senzing repository. $artefact The ENVIRONMENTAL failure above is the whole story. Fix the image or the harness; $hands_off"
          elif [ "$SANDBOX_OUTCOME" != "success" ]; then
            echo "::notice::Ground-truth verification was deliberately SKIPPED. The sandbox preflight never ran (outcome '$SANDBOX_OUTCOME') because an earlier step in this job did not succeed — read the first red step above, not this line, for the cause. $artefact $hands_off"
          else
            echo "::notice::Ground-truth verification was deliberately SKIPPED. The sandbox preflight passed, but the trace analysis then found a sandbox error in the eval's own traces (env_gate ended '$ENV_GATE_OUTCOME'): the agent's Bash tool died mid-run, so no command the eval issued ran and nothing about the plugin was measured. $artefact The ENVIRONMENTAL failure above is the whole story. Fix the image or the harness; $hands_off"
          fi

      - name: Upload eval results, verdict and traces
        if: always() && steps.gate.outputs.has_key == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-senzing-e2e-results
          path: plugins/senzing/evals-real/results/
          if-no-files-found: warn
          retention-days: 14
