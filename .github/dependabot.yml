version: 2
updates:
  - package-ecosystem: "github-actions"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
      exclude:
        - "senzing-factory/*"
    directory: "/"
    groups:
      senzing-factory:
        patterns:
          - "senzing-factory/*"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    # .github/requirements-ci.txt. Added 2026-11-22: PyYAML was installed by an
    # inline `pip install` in ci.yml, where Dependabot cannot see it, so it was
    # never updated and never audited.
    cooldown:
      default-days: 21
    directory: "/.github"
    schedule:
      interval: "daily"
