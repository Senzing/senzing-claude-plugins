---
# zizmor configuration, read by super-linter as
# `zizmor --config .github/linters/zizmor.yaml` (LINTER_RULES_PATH is pinned to
# .github/linters by senzing-factory/build-resources@v4). Without this file
# super-linter supplies its own template, which is `rules: {}` -- so this adds
# one scoped exemption and changes nothing else.
#
# WHY: the `adhoc-packages` audit objects to installing packages inside a job.
# ci.yml installs the Claude Code CLI three times, and it has to:
#   - "Install Claude Code CLI" (x2) runs `claude plugin validate --strict` and
#     the marketplace install smoke. Both exist to test the plugin against the
#     CURRENT CLI, so pinning them would defeat the check they perform.
#   - the eval job installs an explicitly pinned CLAUDE_CLI_VERSION, and zizmor
#     flags that one too -- so pinning is not what this audit wants. It objects
#     to installing a package in CI at all, which is unavoidable for a plugin
#     whose entire test surface IS that CLI.
# There is no `--min-severity` lever here: the invocation lives in the shared
# reusable workflow, and its only input is validate-all-codebase.
#
# SCOPE: ci.yml only, and only this rule. Every other zizmor audit still fails
# the build, in ci.yml and everywhere else. No line numbers, deliberately --
# they move whenever a step is added, and a stale ignore that silently stops
# matching would look like a pass.
rules:
  adhoc-packages:
    ignore:
      - ci.yml
